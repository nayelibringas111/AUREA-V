name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrixflow
          POSTGRES_PASSWORD: matrixflow
          POSTGRES_DB: matrixflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matrixflow" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones Alembic sobre PostgreSQL
        env:
          DATABASE_URL: postgresql://matrixflow:matrixflow@localhost:5432/matrixflow_test
        run: alembic upgrade head && alembic downgrade base
      - name: Pruebas (unitarias, API, seguridad, aceptación)
        env:
          TEST_DATABASE_URL: postgresql://matrixflow:matrixflow@localhost:5432/matrixflow_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
